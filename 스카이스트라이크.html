<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>스카이 스트라이커</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b1020; overflow: hidden; touch-action: none; }
  body { display: flex; align-items: center; justify-content: center; font-family: system-ui, -apple-system, "Apple SD Gothic Neo", sans-serif; }
  canvas { display: block; background: #1d5f8a; box-shadow: 0 0 40px rgba(0,0,0,.6); image-rendering: auto; }
</style>
</head>
<body>
<canvas id="c" width="480" height="720"></canvas>
<script>
(() => {
'use strict';
const W = 480, H = 720;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');

function fit() {
  const s = Math.min(innerWidth / W, innerHeight / H);
  cv.style.width = (W * s) + 'px';
  cv.style.height = (H * s) + 'px';
}
addEventListener('resize', fit); fit();

// ---------- 사운드 ----------
let ac = null;
function audio() { if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } return ac; }
function sfx(type) {
  const a = audio(); if (!a) return;
  const t = a.currentTime, o = a.createOscillator(), g = a.createGain();
  o.connect(g); g.connect(a.destination);
  const p = {
    shoot: ['square', 880, 440, 0.03, 0.05],
    hit:   ['square', 220, 110, 0.05, 0.06],
    boom:  ['sawtooth', 160, 30, 0.12, 0.35],
    big:   ['sawtooth', 120, 20, 0.2, 0.8],
    power: ['triangle', 440, 1320, 0.12, 0.25],
    hurt:  ['sawtooth', 300, 60, 0.15, 0.4],
  }[type];
  o.type = p[0];
  o.frequency.setValueAtTime(p[1], t);
  o.frequency.exponentialRampToValueAtTime(p[2], t + p[4]);
  g.gain.setValueAtTime(p[3], t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + p[4]);
  o.start(t); o.stop(t + p[4] + 0.02);
}

// ---------- 입력 ----------
const keys = {};
addEventListener('keydown', e => {
  keys[e.code] = true;
  if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code)) e.preventDefault();
  if (e.code === 'Enter' || e.code === 'Space') { if (state !== 'play') start(); }
  if ((e.code === 'KeyX' || e.code === 'ShiftLeft' || e.code === 'ShiftRight') && state === 'play') useBomb();
  if ((e.code === 'KeyP' || e.code === 'Escape') && (state === 'play' || state === 'pause')) state = state === 'play' ? 'pause' : 'play';
});
addEventListener('keyup', e => { keys[e.code] = false; });

let touch = null, lastTap = 0;
function toGame(e) {
  const r = cv.getBoundingClientRect();
  return { x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height };
}
cv.addEventListener('pointerdown', e => {
  audio();
  if (state !== 'play') { start(); return; }
  const now = performance.now();
  if (now - lastTap < 280) useBomb();
  lastTap = now;
  const p = toGame(e);
  touch = { id: e.pointerId, sx: p.x, sy: p.y, px: player.x, py: player.y };
  cv.setPointerCapture(e.pointerId);
});
cv.addEventListener('pointermove', e => {
  if (!touch || e.pointerId !== touch.id) return;
  const p = toGame(e);
  player.x = clamp(touch.px + (p.x - touch.sx) * 1.2, 20, W - 20);
  player.y = clamp(touch.py + (p.y - touch.sy) * 1.2, 40, H - 30);
});
cv.addEventListener('pointerup', () => { touch = null; });

// ---------- 유틸 ----------
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const dist2 = (a, b) => (a.x - b.x) ** 2 + (a.y - b.y) ** 2;
let best = 0;
try { best = +localStorage.getItem('skyStrikerBest') || 0; } catch (e) {}

// ---------- 상태 ----------
let state = 'title'; // title, play, pause, over
let player, bullets, eBullets, enemies, parts, items, clouds, islands, floaters;
let score, wave, waveTimer, spawnQ, shake, time, boss, flash, bannerT, bannerText;

function reset() {
  player = { x: W / 2, y: H - 110, r: 12, hp: 5, maxHp: 5, lvl: 1, bombs: 2, cd: 0, inv: 90, shield: 0, bank: 0 };
  bullets = []; eBullets = []; enemies = []; parts = []; items = []; floaters = [];
  score = 0; wave = 0; waveTimer = 60; spawnQ = []; shake = 0; time = 0; boss = null; flash = 0;
  bannerT = 0;
}
function initScenery() {
  clouds = []; islands = [];
  for (let i = 0; i < 7; i++) clouds.push(newCloud(rand(0, H)));
  for (let i = 0; i < 3; i++) islands.push(newIsland(rand(0, H)));
}
function newCloud(y) { return { x: rand(-40, W + 40), y, s: rand(0.6, 1.4), v: rand(1.6, 2.8), a: rand(0.25, 0.55) }; }
function newIsland(y) {
  const pts = [], n = 10, R = rand(40, 90);
  for (let i = 0; i < n; i++) pts.push(R * rand(0.65, 1.15));
  return { x: rand(20, W - 20), y, pts, R, rot: rand(0, 6) };
}
reset(); initScenery();

function start() {
  audio(); reset(); state = 'play';
}

// ---------- 웨이브 ----------
function banner(t) { bannerText = t; bannerT = 120; }
function nextWave() {
  wave++;
  if (wave % 5 === 0) {
    banner('⚠ 보스 출현 ⚠');
    spawnQ.push({ t: 90, f: spawnBoss });
    return;
  }
  banner('WAVE ' + wave);
  const d = 1 + wave * 0.15;
  let t = 60;
  const patterns = [patV, patLine, patSides, patFighters, patHeavy];
  const count = 2 + Math.min(4, Math.floor(wave / 2));
  for (let i = 0; i < count; i++) {
    const p = patterns[Math.floor(Math.random() * Math.min(patterns.length, 2 + Math.floor(wave / 2)))];
    t = p(t, d);
    t += 50;
  }
}
function q(t, f) { spawnQ.push({ t, f }); }
function patV(t, d) {
  const cx = rand(100, W - 100);
  for (let i = 0; i < 5; i++) {
    const off = (i - 2) * 36;
    q(t + Math.abs(i - 2) * 10, () => addEnemy('scout', cx + off, -30, d));
  }
  return t + 60;
}
function patLine(t, d) {
  const left = Math.random() < .5;
  for (let i = 0; i < 6; i++) q(t + i * 14, () => addEnemy('weaver', left ? 90 : W - 90, -30, d, { phase: i * .6, dir: left ? 1 : -1 }));
  return t + 100;
}
function patSides(t, d) {
  for (let i = 0; i < 4; i++) {
    q(t + i * 18, () => addEnemy('swoop', -20, 80 + i * 30, d, { dir: 1 }));
    q(t + i * 18 + 9, () => addEnemy('swoop', W + 20, 100 + i * 30, d, { dir: -1 }));
  }
  return t + 90;
}
function patFighters(t, d) {
  const n = 2 + (wave > 6 ? 1 : 0);
  for (let i = 0; i < n; i++) q(t + i * 30, () => addEnemy('fighter', rand(60, W - 60), -30, d));
  return t + 80;
}
function patHeavy(t, d) {
  q(t, () => addEnemy('heavy', rand(100, W - 100), -50, d));
  return t + 120;
}

const ETYPES = {
  scout:   { hp: 2,  r: 13, score: 100, col: '#e0563b' },
  weaver:  { hp: 2,  r: 13, score: 120, col: '#d98b2b' },
  swoop:   { hp: 3,  r: 13, score: 150, col: '#b84ad9' },
  fighter: { hp: 7,  r: 17, score: 300, col: '#3a8f4a' },
  heavy:   { hp: 30, r: 32, score: 1000, col: '#5d6470' },
};
function addEnemy(type, x, y, d, extra = {}) {
  const T = ETYPES[type];
  enemies.push(Object.assign({ type, x, y, vx: 0, vy: 0, hp: Math.ceil(T.hp * d), maxHp: Math.ceil(T.hp * d), r: T.r, t: 0, cd: rand(40, 120), hitT: 0, d }, extra));
}
function spawnBoss() {
  const d = 1 + wave * 0.2;
  boss = { type: 'boss', x: W / 2, y: -120, vx: 0, vy: 0, hp: Math.round(400 * d), maxHp: Math.round(400 * d), r: 60, t: 0, cd: 60, hitT: 0, d, phase: 0, entered: false };
  enemies.push(boss);
}

// ---------- 발사 ----------
function fireBullet(x, y, angle, speed, kind = 'n') {
  eBullets.push({ x, y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed, r: kind === 'b' ? 6 : 4, kind });
}
function aimAt(e) { return Math.atan2(player.y - e.y, player.x - e.x); }

function playerShoot() {
  const L = player.lvl, x = player.x, y = player.y - 18;
  const add = (dx, ang, dmg = 1, w = 3) => bullets.push({ x: x + dx, y, vx: Math.sin(ang) * 14, vy: -Math.cos(ang) * 14, dmg, w });
  if (L === 1) { add(-5, 0); add(5, 0); }
  else if (L === 2) { add(-8, 0); add(0, 0, 1.2); add(8, 0); }
  else if (L === 3) { add(-8, 0); add(0, 0, 1.2); add(8, 0); add(-12, -0.15); add(12, 0.15); }
  else if (L === 4) { add(-10, 0); add(-4, 0, 1.3, 4); add(4, 0, 1.3, 4); add(10, 0); add(-14, -0.18); add(14, 0.18); }
  else { add(-10, 0, 1.4, 4); add(-3, 0, 1.6, 5); add(3, 0, 1.6, 5); add(10, 0, 1.4, 4); add(-14, -0.15); add(14, 0.15); add(-16, -0.3); add(16, 0.3); }
  // 유도 미사일 (레벨 3 이상)
  if (L >= 3 && time % 24 === 0) {
    for (const s of [-1, 1]) bullets.push({ x: x + s * 16, y: y + 10, vx: s * 3, vy: -3, dmg: 3, w: 4, homing: true, life: 120 });
  }
  if (time % 8 === 0) sfx('shoot');
}

function useBomb() {
  if (player.bombs <= 0) return;
  player.bombs--;
  flash = 20; shake = 25; sfx('big');
  eBullets.length = 0;
  for (const e of enemies) {
    damage(e, e === boss ? 60 : 50);
  }
  for (let i = 0; i < 60; i++) {
    const a = rand(0, Math.PI * 2), s = rand(2, 10);
    parts.push({ x: player.x, y: player.y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: rand(30, 60), max: 60, col: '#fff3b0', size: rand(3, 7) });
  }
  player.inv = Math.max(player.inv, 60);
}

// ---------- 이펙트 ----------
function explode(x, y, size = 1) {
  const n = Math.floor(18 * size);
  for (let i = 0; i < n; i++) {
    const a = rand(0, Math.PI * 2), s = rand(1, 5) * size;
    const cols = ['#fff1a8', '#ffb347', '#ff6a3d', '#c23b22'];
    parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: rand(20, 45), max: 45, col: cols[Math.floor(Math.random() * 4)], size: rand(2, 5) * Math.sqrt(size) });
  }
  for (let i = 0; i < 6 * size; i++) {
    const a = rand(0, Math.PI * 2), s = rand(0.3, 1.5);
    parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s + 1, life: rand(40, 70), max: 70, col: 'smoke', size: rand(6, 12) * Math.sqrt(size) });
  }
  parts.push({ x, y, vx: 0, vy: 0, life: 12, max: 12, col: 'ring', size: 30 * size });
}
function floatText(x, y, t, col = '#fff') { floaters.push({ x, y, t, col, life: 50 }); }

function damage(e, dmg) {
  if (e.dead) return;
  if (e === boss && !e.entered) return;
  e.hp -= dmg; e.hitT = 4;
  if (e.hp <= 0) kill(e);
}
function kill(e) {
  e.dead = true;
  const base = e.type === 'boss' ? 20000 : ETYPES[e.type].score;
  const pts = base * (1 + Math.floor(wave / 5));
  score += pts;
  floatText(e.x, e.y, '+' + pts, '#ffe07a');
  if (e.type === 'boss') {
    for (let i = 0; i < 10; i++) setTimeoutFrames(i * 6, () => explode(e.x + rand(-60, 60), e.y + rand(-40, 40), 2));
    shake = 40; flash = 15; sfx('big');
    boss = null;
    eBullets.length = 0;
    dropItem(e.x - 30, e.y, 'P'); dropItem(e.x + 30, e.y, 'H'); dropItem(e.x, e.y + 20, 'B');
  } else {
    explode(e.x, e.y, e.type === 'heavy' ? 2.2 : e.type === 'fighter' ? 1.3 : 1);
    shake = Math.max(shake, e.type === 'heavy' ? 14 : 4);
    sfx('boom');
    const r = Math.random();
    const chance = e.type === 'heavy' ? 1 : e.type === 'fighter' ? 0.35 : 0.08;
    if (r < chance) {
      const k = Math.random();
      dropItem(e.x, e.y, k < 0.5 ? 'P' : k < 0.7 ? 'B' : k < 0.85 ? 'S' : 'H');
    }
  }
}
const timers = [];
function setTimeoutFrames(n, f) { timers.push({ n, f }); }
function dropItem(x, y, k) { items.push({ x, y, k, vx: rand(-1, 1), vy: -1.5, t: 0 }); }

function hurtPlayer() {
  if (player.inv > 0) return;
  if (player.shield > 0) { player.shield = 0; player.inv = 60; sfx('hit'); floatText(player.x, player.y - 30, '실드 파괴!', '#7fe3ff'); return; }
  player.hp--; player.inv = 100; shake = 18; sfx('hurt');
  player.lvl = Math.max(1, player.lvl - 1);
  explode(player.x, player.y, 0.8);
  if (player.hp <= 0) {
    explode(player.x, player.y, 3); sfx('big');
    state = 'over';
    if (score > best) { best = score; try { localStorage.setItem('skyStrikerBest', best); } catch (e) {} }
  }
}

// ---------- 업데이트 ----------
function update() {
  time++;
  // 배경
  for (const c of clouds) { c.y += c.v; if (c.y > H + 80) Object.assign(c, newCloud(-80)); }
  for (const s of islands) { s.y += 0.8; if (s.y > H + s.R + 20) Object.assign(s, newIsland(-120)); }

  if (state !== 'play') { updateParts(); return; }

  // 플레이어 이동
  const sp = 5.2;
  let dx = 0, dy = 0;
  if (keys.ArrowLeft || keys.KeyA) dx -= 1;
  if (keys.ArrowRight || keys.KeyD) dx += 1;
  if (keys.ArrowUp || keys.KeyW) dy -= 1;
  if (keys.ArrowDown || keys.KeyS) dy += 1;
  if (dx && dy) { dx *= 0.707; dy *= 0.707; }
  player.x = clamp(player.x + dx * sp, 20, W - 20);
  player.y = clamp(player.y + dy * sp, 40, H - 30);
  const targetBank = touch ? 0 : dx;
  player.bank += (targetBank - player.bank) * 0.2;
  if (player.inv > 0) player.inv--;
  if (player.shield > 0) player.shield--;

  // 자동 사격
  if (--player.cd <= 0) { playerShoot(); player.cd = 6; }

  // 웨이브 진행
  if (spawnQ.length === 0 && enemies.length === 0 && !boss) {
    if (--waveTimer <= 0) { nextWave(); waveTimer = 80; }
  }
  for (const s of spawnQ) s.t--;
  for (let i = spawnQ.length - 1; i >= 0; i--) if (spawnQ[i].t <= 0) { spawnQ[i].f(); spawnQ.splice(i, 1); }
  for (let i = timers.length - 1; i >= 0; i--) if (--timers[i].n <= 0) { timers[i].f(); timers.splice(i, 1); }
  if (bannerT > 0) bannerT--;

  // 플레이어 탄
  for (const b of bullets) {
    if (b.homing) {
      b.life--;
      let tgt = null, bd = 1e9;
      for (const e of enemies) { if (e.dead || e.y < 0) continue; const d = dist2(b, e); if (d < bd) { bd = d; tgt = e; } }
      if (tgt) {
        const a = Math.atan2(tgt.y - b.y, tgt.x - b.x);
        b.vx += Math.cos(a) * 0.9; b.vy += Math.sin(a) * 0.9;
      } else b.vy -= 0.6;
      const s = Math.hypot(b.vx, b.vy), m = 9;
      if (s > m) { b.vx *= m / s; b.vy *= m / s; }
      if (time % 2 === 0) parts.push({ x: b.x, y: b.y, vx: 0, vy: 0.5, life: 14, max: 14, col: 'smoke', size: 3 });
    }
    b.x += b.vx; b.y += b.vy;
    for (const e of enemies) {
      if (e.dead) continue;
      if (dist2(b, e) < (e.r + 4) ** 2) {
        damage(e, b.dmg); b.gone = true; sfx('hit');
        parts.push({ x: b.x, y: b.y, vx: 0, vy: 0, life: 6, max: 6, col: '#fff', size: 5 });
        break;
      }
    }
  }
  bullets = bullets.filter(b => !b.gone && b.y > -20 && b.y < H + 20 && b.x > -20 && b.x < W + 20 && (!b.homing || b.life > 0));

  // 적
  for (const e of enemies) {
    e.t++; if (e.hitT > 0) e.hitT--;
    switch (e.type) {
      case 'scout':
        e.vy = 2.6 + e.d * 0.3; e.vx = 0; break;
      case 'weaver':
        e.vy = 2.4; e.x += Math.cos(e.t * 0.05 + e.phase) * 3 * e.dir; break;
      case 'swoop': {
        const k = e.t;
        e.vx = e.dir * 3.6; e.vy = k < 40 ? 0.4 : 3;
        if (k > 40) e.vx *= 0.97 ** (k - 40);
        break;
      }
      case 'fighter':
        if (e.y < 140) e.vy = 2.5; else { e.vy = 0.3; e.vx = Math.sin(e.t * 0.03) * 1.6; }
        if (e.t > 600) e.vy = 3;
        if (--e.cd <= 0 && e.y > 0) {
          const a = aimAt(e);
          for (const s of [-0.15, 0, 0.15]) fireBullet(e.x, e.y + 12, a + s, 3.6);
          e.cd = Math.max(50, 110 - wave * 4);
        }
        break;
      case 'heavy':
        e.vy = e.y < 160 ? 1.2 : 0.25; e.vx = Math.sin(e.t * 0.015) * 0.8;
        if (e.t > 900) e.vy = 1.5;
        if (--e.cd <= 0 && e.y > 0) {
          const n = 10, off = e.t * 0.05;
          for (let i = 0; i < n; i++) fireBullet(e.x, e.y, off + i * Math.PI * 2 / n, 2.4, 'b');
          e.cd = Math.max(60, 120 - wave * 3);
        }
        break;
      case 'boss': updateBoss(e); break;
    }
    // 정찰기 / 위버 가끔 사격
    if ((e.type === 'scout' || e.type === 'weaver' || e.type === 'swoop') && wave >= 2) {
      if (--e.cd <= 0 && e.y > 30 && e.y < H * 0.6) { fireBullet(e.x, e.y, aimAt(e), 3.2); e.cd = rand(120, 220); }
    }
    e.x += e.vx; e.y += e.vy;
    // 충돌
    if (!e.dead && dist2(e, player) < (e.r + player.r - 4) ** 2) {
      hurtPlayer();
      if (e.type !== 'boss' && e.type !== 'heavy') kill(e);
    }
    if (e.y > H + 80 || e.x < -100 || e.x > W + 100) e.gone = true;
  }
  enemies = enemies.filter(e => !e.dead && !e.gone);

  // 적 탄
  for (const b of eBullets) {
    b.x += b.vx; b.y += b.vy;
    if (dist2(b, player) < (b.r + 5) ** 2) { hurtPlayer(); b.gone = true; }
  }
  eBullets = eBullets.filter(b => !b.gone && b.y > -20 && b.y < H + 20 && b.x > -20 && b.x < W + 20);

  // 아이템
  for (const it of items) {
    it.t++;
    it.vy = Math.min(it.vy + 0.05, 1.6);
    it.x += it.vx; it.y += it.vy;
    if (it.x < 15 || it.x > W - 15) it.vx *= -1;
    const d = Math.sqrt(dist2(it, player));
    if (d < 90) { it.x += (player.x - it.x) * 0.08; it.y += (player.y - it.y) * 0.08; }
    if (d < 24) {
      it.gone = true; sfx('power');
      if (it.k === 'P') { if (player.lvl < 5) { player.lvl++; floatText(it.x, it.y, '파워 업!', '#ffd84a'); } else { score += 2000; floatText(it.x, it.y, '+2000', '#ffd84a'); } }
      if (it.k === 'B') { player.bombs = Math.min(5, player.bombs + 1); floatText(it.x, it.y, '폭탄 +1', '#ff8a5c'); }
      if (it.k === 'H') { player.hp = Math.min(player.maxHp, player.hp + 1); floatText(it.x, it.y, '체력 회복', '#6dff8f'); }
      if (it.k === 'S') { player.shield = 600; floatText(it.x, it.y, '실드!', '#7fe3ff'); }
    }
  }
  items = items.filter(it => !it.gone && it.y < H + 30);

  updateParts();
}

function updateBoss(e) {
  if (!e.entered) {
    e.vy = 1.2; e.vx = 0;
    if (e.y >= 130) { e.entered = true; e.vy = 0; }
    return;
  }
  e.vy = 0;
  e.vx = Math.sin(e.t * 0.012) * 1.8;
  const hpR = e.hp / e.maxHp;
  e.phase = hpR > 0.66 ? 0 : hpR > 0.33 ? 1 : 2;
  e.cd--;
  if (e.cd <= 0) {
    const pat = (Math.floor(e.t / 200) + e.phase) % 3;
    if (pat === 0) {
      // 회전 나선
      for (let k = 0; k < 3; k++) fireBullet(e.x, e.y + 20, e.t * 0.13 + k * Math.PI * 2 / 3, 2.8);
      e.cd = e.phase === 2 ? 3 : 5;
    } else if (pat === 1) {
      // 조준 부채꼴
      const a = aimAt(e), n = 5 + e.phase * 2;
      for (let i = 0; i < n; i++) fireBullet(e.x, e.y + 30, a + (i - (n - 1) / 2) * 0.13, 3.4);
      e.cd = 40 - e.phase * 8;
    } else {
      // 양쪽 포대에서 큰 탄
      for (const s of [-1, 1]) {
        const g = { x: e.x + s * 55, y: e.y + 10 };
        fireBullet(g.x, g.y, Math.atan2(player.y - g.y, player.x - g.x), 2.6, 'b');
      }
      e.cd = 22 - e.phase * 5;
    }
  }
  // 3단계: 원형 탄막 추가
  if (e.phase >= 1 && e.t % 140 === 0) {
    const n = 16 + e.phase * 4;
    for (let i = 0; i < n; i++) fireBullet(e.x, e.y, i * Math.PI * 2 / n, 2, 'b');
  }
}

function updateParts() {
  for (const p of parts) { p.x += p.vx; p.y += p.vy; p.vx *= 0.95; p.vy *= 0.95; p.life--; }
  parts = parts.filter(p => p.life > 0);
  for (const f of floaters) { f.y -= 0.8; f.life--; }
  floaters = floaters.filter(f => f.life > 0);
  if (shake > 0) shake *= 0.88, shake < 0.5 && (shake = 0);
  if (flash > 0) flash--;
}

// ---------- 그리기 ----------
function drawBG() {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#16507a'); g.addColorStop(1, '#2479a8');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  // 물결
  ctx.strokeStyle = 'rgba(255,255,255,0.06)'; ctx.lineWidth = 2;
  const off = (time * 0.8) % 40;
  for (let y = -40 + off; y < H; y += 40) {
    ctx.beginPath();
    for (let x = 0; x <= W; x += 20) ctx.lineTo(x, y + Math.sin(x * 0.05 + y * 0.1) * 4);
    ctx.stroke();
  }
  // 섬
  for (const s of islands) {
    ctx.save(); ctx.translate(s.x, s.y); ctx.rotate(s.rot);
    const shape = (scale) => {
      ctx.beginPath();
      s.pts.forEach((r, i) => {
        const a = i / s.pts.length * Math.PI * 2;
        ctx.lineTo(Math.cos(a) * r * scale, Math.sin(a) * r * scale);
      });
      ctx.closePath();
    };
    ctx.fillStyle = 'rgba(120,210,220,0.35)'; shape(1.18); ctx.fill();
    ctx.fillStyle = '#d9c48a'; shape(1.0); ctx.fill();
    ctx.fillStyle = '#4f8a3c'; shape(0.82); ctx.fill();
    ctx.fillStyle = '#3d7030'; shape(0.5); ctx.fill();
    ctx.restore();
  }
}
function drawClouds(front) {
  for (const c of clouds) {
    if ((c.s > 1) !== front) continue;
    ctx.fillStyle = `rgba(255,255,255,${front ? c.a * 0.6 : c.a})`;
    ctx.beginPath();
    for (const [ox, oy, r] of [[0, 0, 30], [25, 5, 24], [-25, 6, 22], [10, -14, 20], [-10, 14, 20]]) {
      ctx.moveTo(c.x + ox * c.s + r * c.s, c.y + oy * c.s);
      ctx.arc(c.x + ox * c.s, c.y + oy * c.s, r * c.s, 0, Math.PI * 2);
    }
    ctx.fill();
  }
}

function drawPlane(x, y, opts) {
  // opts: body, wing, scale, dir(1=up,-1=down), bank
  const s = opts.scale || 1, dir = opts.dir || 1, bank = opts.bank || 0;
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(s * (1 - Math.abs(bank) * 0.15), s * dir);
  // 그림자
  ctx.save(); ctx.translate(14 / s, 26 / s * dir); ctx.fillStyle = 'rgba(0,0,0,0.22)';
  planePath(); ctx.fill(); ctx.restore();
  ctx.fillStyle = opts.wing; planeWings(); ctx.fill();
  ctx.fillStyle = opts.body;
  ctx.beginPath(); ctx.ellipse(0, 0, 5, 20, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = 'rgba(160,220,255,0.9)';
  ctx.beginPath(); ctx.ellipse(0, -6, 2.6, 5, 0, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}
function planeWings() {
  ctx.beginPath();
  ctx.moveTo(0, -6); ctx.lineTo(22, 6); ctx.lineTo(22, 10); ctx.lineTo(0, 6);
  ctx.lineTo(-22, 10); ctx.lineTo(-22, 6); ctx.closePath();
  ctx.moveTo(0, 12); ctx.lineTo(9, 19); ctx.lineTo(9, 21); ctx.lineTo(0, 19); ctx.lineTo(-9, 21); ctx.lineTo(-9, 19); ctx.closePath();
}
function planePath() {
  planeWings();
  ctx.ellipse(0, 0, 5, 20, 0, 0, Math.PI * 2);
}

function drawPlayer() {
  if (state === 'over') return;
  if (player.inv > 0 && Math.floor(player.inv / 4) % 2 === 0) return;
  // 엔진 불꽃
  const fl = rand(6, 12);
  ctx.fillStyle = '#ffb347';
  ctx.beginPath(); ctx.moveTo(player.x - 3, player.y + 18); ctx.lineTo(player.x, player.y + 18 + fl); ctx.lineTo(player.x + 3, player.y + 18); ctx.fill();
  drawPlane(player.x, player.y, { body: '#e8eef5', wing: '#3b6fd4', scale: 1.15, dir: 1, bank: player.bank });
  if (player.shield > 0 && (player.shield > 120 || time % 10 < 5)) {
    ctx.strokeStyle = `rgba(127,227,255,${0.5 + Math.sin(time * 0.2) * 0.2})`; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(player.x, player.y, 32, 0, Math.PI * 2); ctx.stroke();
    ctx.fillStyle = 'rgba(127,227,255,0.12)'; ctx.fill();
  }
  // 피격 판정 표시
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(player.x, player.y, 3, 0, Math.PI * 2); ctx.fill();
}

function drawEnemy(e) {
  const T = ETYPES[e.type];
  const hit = e.hitT > 0;
  if (e.type === 'boss') return drawBoss(e);
  if (e.type === 'heavy') {
    ctx.save(); ctx.translate(e.x, e.y);
    ctx.fillStyle = 'rgba(0,0,0,0.22)'; ctx.fillRect(-38 + 16, -16 + 30, 76, 26);
    ctx.fillStyle = hit ? '#fff' : '#4a5059';
    ctx.fillRect(-44, -8, 88, 18);           // 날개
    ctx.fillRect(-18, 18, 36, 8);            // 꼬리 날개
    ctx.fillStyle = hit ? '#fff' : T.col;
    ctx.beginPath(); ctx.ellipse(0, 0, 12, 32, 0, 0, Math.PI * 2); ctx.fill();
    for (const ex of [-28, -14, 14, 28]) { ctx.fillStyle = hit ? '#fff' : '#2c3138'; ctx.fillRect(ex - 4, -4, 8, 16); }
    ctx.fillStyle = '#ff5a5a'; ctx.beginPath(); ctx.arc(0, 18, 4 + Math.sin(e.t * 0.2) * 1.5, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  } else {
    const scale = e.type === 'fighter' ? 1.0 : 0.75;
    const bank = e.type === 'swoop' ? clamp(e.vx / 4, -1, 1) : e.type === 'weaver' ? Math.sin(e.t * 0.05 + e.phase) * e.dir : 0;
    drawPlane(e.x, e.y, { body: hit ? '#fff' : T.col, wing: hit ? '#fff' : shade(T.col), scale, dir: -1, bank });
  }
  if (e.maxHp >= 6 && e.hp < e.maxHp) {
    const w = e.r * 2;
    ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(e.x - w / 2, e.y - e.r - 10, w, 4);
    ctx.fillStyle = '#ff5a5a'; ctx.fillRect(e.x - w / 2, e.y - e.r - 10, w * e.hp / e.maxHp, 4);
  }
}
function shade(hex) {
  const n = parseInt(hex.slice(1), 16);
  const f = c => Math.floor(c * 0.65);
  return `rgb(${f(n >> 16)},${f((n >> 8) & 255)},${f(n & 255)})`;
}
function drawBoss(e) {
  const hit = e.hitT > 0;
  ctx.save(); ctx.translate(e.x, e.y);
  ctx.fillStyle = 'rgba(0,0,0,0.25)';
  ctx.beginPath(); ctx.ellipse(20, 40, 110, 40, 0, 0, Math.PI * 2); ctx.fill();
  // 날개
  ctx.fillStyle = hit ? '#fff' : '#3a2f4a';
  ctx.beginPath(); ctx.moveTo(-110, -10); ctx.lineTo(110, -10); ctx.lineTo(80, 25); ctx.lineTo(-80, 25); ctx.closePath(); ctx.fill();
  // 동체
  ctx.fillStyle = hit ? '#fff' : '#6b2f5a';
  ctx.beginPath(); ctx.ellipse(0, 0, 32, 60, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = hit ? '#fff' : '#8c3d74';
  ctx.beginPath(); ctx.ellipse(0, -10, 18, 36, 0, 0, Math.PI * 2); ctx.fill();
  // 포대
  for (const s of [-1, 1]) {
    ctx.fillStyle = hit ? '#fff' : '#22252b';
    ctx.beginPath(); ctx.arc(s * 55, 10, 12, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#ff4d4d';
    ctx.beginPath(); ctx.arc(s * 55, 10, 4 + Math.sin(e.t * 0.15) * 2, 0, Math.PI * 2); ctx.fill();
    // 프로펠러
    ctx.strokeStyle = 'rgba(220,220,220,0.6)'; ctx.lineWidth = 3;
    const a = e.t * 0.6;
    ctx.beginPath();
    ctx.moveTo(s * 88 + Math.cos(a) * 14, -14 + Math.sin(a) * 4); ctx.lineTo(s * 88 - Math.cos(a) * 14, -14 - Math.sin(a) * 4);
    ctx.stroke();
  }
  // 코어
  const glow = e.phase === 2 ? '#ff3b3b' : e.phase === 1 ? '#ffa13b' : '#ffd84a';
  ctx.fillStyle = glow; ctx.shadowColor = glow; ctx.shadowBlur = 20;
  ctx.beginPath(); ctx.arc(0, 30, 9, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

function drawBullets() {
  for (const b of bullets) {
    if (b.homing) {
      ctx.fillStyle = '#ffd84a';
      ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(Math.atan2(b.vy, b.vx) + Math.PI / 2);
      ctx.fillRect(-2, -6, 4, 12); ctx.restore();
    } else {
      ctx.fillStyle = '#fff6a0';
      ctx.fillRect(b.x - b.w / 2, b.y - 8, b.w, 16);
      ctx.fillStyle = 'rgba(255,220,80,0.35)';
      ctx.fillRect(b.x - b.w, b.y - 4, b.w * 2, 14);
    }
  }
  for (const b of eBullets) {
    ctx.fillStyle = b.kind === 'b' ? '#ff4fa3' : '#ff5a3c';
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r + 2, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r - 1.5, 0, Math.PI * 2); ctx.fill();
  }
}
function drawItems() {
  const C = { P: '#ffd84a', B: '#ff8a5c', H: '#6dff8f', S: '#7fe3ff' };
  for (const it of items) {
    const blink = it.y > H - 120 && it.t % 10 < 5;
    ctx.save(); ctx.translate(it.x, it.y);
    ctx.rotate(Math.sin(it.t * 0.08) * 0.3);
    ctx.fillStyle = blink ? '#fff' : C[it.k];
    ctx.shadowColor = C[it.k]; ctx.shadowBlur = 12;
    ctx.beginPath(); ctx.roundRect(-12, -12, 24, 24, 6); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#1a1a1a'; ctx.font = 'bold 16px system-ui'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(it.k, 0, 1);
    ctx.restore();
  }
}
function drawParts() {
  for (const p of parts) {
    const a = p.life / p.max;
    if (p.col === 'smoke') {
      ctx.fillStyle = `rgba(70,70,70,${a * 0.4})`;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size * (2 - a), 0, Math.PI * 2); ctx.fill();
    } else if (p.col === 'ring') {
      ctx.strokeStyle = `rgba(255,240,200,${a})`; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size * (1.4 - a), 0, Math.PI * 2); ctx.stroke();
    } else {
      ctx.globalAlpha = a; ctx.fillStyle = p.col;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 1;
    }
  }
  ctx.textAlign = 'center'; ctx.font = 'bold 15px system-ui';
  for (const f of floaters) {
    ctx.globalAlpha = Math.min(1, f.life / 20);
    ctx.fillStyle = '#000'; ctx.fillText(f.t, f.x + 1, f.y + 1);
    ctx.fillStyle = f.col; ctx.fillText(f.t, f.x, f.y);
  }
  ctx.globalAlpha = 1;
}

function drawHUD() {
  ctx.textBaseline = 'top'; ctx.textAlign = 'left';
  ctx.font = 'bold 20px system-ui';
  txt('SCORE ' + score.toLocaleString(), 12, 10, '#fff');
  ctx.font = '13px system-ui';
  txt('BEST ' + Math.max(best, score).toLocaleString(), 12, 34, '#cde');
  ctx.textAlign = 'right'; ctx.font = 'bold 16px system-ui';
  txt('WAVE ' + Math.max(1, wave), W - 12, 10, '#fff');
  // 체력
  for (let i = 0; i < player.maxHp; i++) {
    ctx.fillStyle = i < player.hp ? '#ff5a6e' : 'rgba(255,255,255,0.2)';
    heart(W - 20 - i * 22, 44);
  }
  // 하단: 무기 레벨 & 폭탄
  ctx.textAlign = 'left'; ctx.textBaseline = 'bottom'; ctx.font = 'bold 14px system-ui';
  txt('무기 Lv.' + player.lvl + (player.lvl >= 5 ? ' MAX' : ''), 12, H - 10, '#ffd84a');
  ctx.textAlign = 'right';
  txt('폭탄 ' + '●'.repeat(player.bombs) + '○'.repeat(Math.max(0, 5 - player.bombs)), W - 12, H - 10, '#ff8a5c');
  // 보스 체력바
  if (boss && boss.entered) {
    const w = W - 80;
    ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(40, 66, w, 10);
    ctx.fillStyle = '#ff3b6b'; ctx.fillRect(40, 66, w * Math.max(0, boss.hp) / boss.maxHp, 10);
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 1; ctx.strokeRect(40, 66, w, 10);
  }
  if (bannerT > 0) {
    const a = Math.min(1, bannerT / 20, (120 - bannerT) / 15 + 0.2);
    ctx.globalAlpha = a; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = 'bold 40px system-ui';
    txt(bannerText, W / 2, H * 0.4, bannerText.includes('보스') ? '#ff5a5a' : '#fff');
    ctx.globalAlpha = 1;
  }
}
function txt(t, x, y, c) { ctx.fillStyle = 'rgba(0,0,0,0.55)'; ctx.fillText(t, x + 2, y + 2); ctx.fillStyle = c; ctx.fillText(t, x, y); }
function heart(x, y) {
  ctx.beginPath();
  ctx.moveTo(x, y + 14);
  ctx.bezierCurveTo(x - 12, y + 6, x - 8, y - 4, x, y + 3);
  ctx.bezierCurveTo(x + 8, y - 4, x + 12, y + 6, x, y + 14);
  ctx.fill();
}

function drawOverlay() {
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  if (state === 'title') {
    ctx.fillStyle = 'rgba(5,15,35,0.55)'; ctx.fillRect(0, 0, W, H);
    ctx.font = 'bold 52px system-ui';
    txt('스카이', W / 2, 190, '#ffd84a');
    txt('스트라이커', W / 2, 248, '#fff');
    drawPlane(W / 2, 350 + Math.sin(time * 0.05) * 6, { body: '#e8eef5', wing: '#3b6fd4', scale: 2, dir: 1 });
    ctx.font = '16px system-ui';
    const lines = ['이동: 방향키 / WASD  (터치: 드래그)', '사격: 자동', '폭탄: X 또는 Shift  (터치: 더블탭)', '일시정지: P / Esc'];
    lines.forEach((l, i) => txt(l, W / 2, 450 + i * 26, '#dde8f5'));
    ctx.font = '14px system-ui';
    txt('P 파워업 · B 폭탄 · H 체력 · S 실드', W / 2, 570, '#ffd84a');
    if (time % 60 < 40) { ctx.font = 'bold 22px system-ui'; txt('Enter / Space / 탭하여 시작', W / 2, 630, '#fff'); }
  } else if (state === 'pause') {
    ctx.fillStyle = 'rgba(5,15,35,0.5)'; ctx.fillRect(0, 0, W, H);
    ctx.font = 'bold 44px system-ui'; txt('일시정지', W / 2, H / 2, '#fff');
    ctx.font = '16px system-ui'; txt('P / Esc 로 계속', W / 2, H / 2 + 44, '#dde8f5');
  } else if (state === 'over') {
    ctx.fillStyle = 'rgba(20,5,10,0.55)'; ctx.fillRect(0, 0, W, H);
    ctx.font = 'bold 50px system-ui'; txt('GAME OVER', W / 2, 260, '#ff5a5a');
    ctx.font = 'bold 24px system-ui'; txt('점수 ' + score.toLocaleString(), W / 2, 330, '#fff');
    ctx.font = '18px system-ui'; txt('최고 ' + best.toLocaleString() + (score >= best && score > 0 ? '  🏆 신기록!' : ''), W / 2, 366, '#ffd84a');
    txt('도달 웨이브 ' + wave, W / 2, 396, '#dde8f5');
    if (time % 60 < 40) { ctx.font = 'bold 22px system-ui'; txt('Enter / Space / 탭하여 재시작', W / 2, 470, '#fff'); }
  }
}

function render() {
  ctx.save();
  if (shake > 0) ctx.translate(rand(-shake, shake) * 0.5, rand(-shake, shake) * 0.5);
  drawBG();
  drawClouds(false);
  for (const it of items) {}
  drawItems();
  for (const e of enemies) drawEnemy(e);
  drawBullets();
  drawPlayer();
  drawParts();
  drawClouds(true);
  ctx.restore();
  if (flash > 0) { ctx.fillStyle = `rgba(255,255,240,${flash / 25})`; ctx.fillRect(0, 0, W, H); }
  if (state !== 'title') drawHUD();
  drawOverlay();
}

// ---------- 루프 (고정 60fps 업데이트) ----------
let last = performance.now(), acc = 0;
function loop(now) {
  acc += Math.min(100, now - last); last = now;
  while (acc >= 1000 / 60) {
    if (state !== 'pause') update();
    acc -= 1000 / 60;
  }
  render();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
